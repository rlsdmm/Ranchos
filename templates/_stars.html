{# Estrelas de 0 a 5 (meia estrela arredonda para cima a partir de .5), com texto para leitor de tela. #}
{% macro stars(value, cls="") %}
{% set full = (value + 0.5)|int %}
<span class="stars {{ cls }}" role="img" aria-label="Nota {{ '%.1f'|format(value)|replace('.', ',') }} de 5">{% for i in range(1, 6) %}<span class="{{ 'on' if i <= full }}">★</span>{% endfor %}</span>
{% endmacro %}
